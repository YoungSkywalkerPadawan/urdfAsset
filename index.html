<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>URDF 资产库 · 参考关节预览</title>
<style>
:root{color-scheme:dark;font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif;color:#dee6ed;background:#0c1119}*{box-sizing:border-box}body{margin:0}header{height:86px;padding:15px 24px;border-bottom:1px solid #283340;background:#111a25}h1{font-size:21px;margin:0 0 3px}header p{margin:0;color:#99abbc;font-size:12px}.layout{display:grid;grid-template-columns:285px minmax(450px,1fr) 325px;height:calc(100vh - 86px)}aside{padding:16px;overflow:auto;border-right:1px solid #283340}.right{border-left:1px solid #283340;border-right:0}input,select,button{font:inherit;color:inherit;background:#1b2939;border:1px solid #36485c;border-radius:7px;padding:8px}input,select{width:100%;margin:5px 0}button{cursor:pointer}button:hover{background:#304359}button.active{background:#116962;border-color:#5dd2b9}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:9px 0}.row>*{flex:1}button.small{font-size:12px;padding:5px 8px}.muted{color:#8fa3b6;font-size:12px}.stat{display:flex;gap:18px;margin-bottom:12px}.stat b{font-size:23px;color:#72dec7;display:block}.asset{display:block;width:100%;text-align:left;padding:10px;margin:6px 0;border-color:#26374a;overflow:hidden}.asset.selected{border-color:#65d5ba;background:#153731}.asset .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.asset span{color:#8fa3b6;font-size:11px}main{position:relative;min-width:0;background:radial-gradient(ellipse at 50% 45%,#263b50,#101824)}#canvas{width:100%;height:100%;display:block}.overlay{position:absolute;left:18px;top:17px;max-width:85%;pointer-events:none}.overlay b{display:block;font-size:16px}.overlay p{margin:5px 0;color:#bbc9d8;font-size:12px}.bar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#101925dd;padding:8px 12px;border:1px solid #3b4c5e;border-radius:12px}.bar input{width:110px}.panel{border-top:1px solid #283746;margin-top:15px;padding-top:12px}.label{font-size:12px;color:#89a1b8;display:block;margin-top:8px}#jointInfo{font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:#101823;padding:11px;border-radius:8px}a{color:#75cfe4;text-decoration:none}a:hover{text-decoration:underline}.pill{border:1px solid #3c5063;border-radius:20px;font-size:11px;padding:2px 7px;margin-right:5px}.notice{background:#352c19;border-left:3px solid #dfb969;padding:10px;font-size:12px;color:#e3cea3}#loading{position:absolute;top:45%;left:35%;padding:12px;background:#101925dd;border-radius:10px}label.check{display:block;margin:10px 0}label.check input{width:auto;margin-right:7px}#reviewStatus{color:#70debc}#assetCount{margin:8px 0}.legend{position:absolute;left:18px;bottom:22px;font-size:12px;color:#b1c3d3}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}@media(max-width:1050px){.layout{grid-template-columns:225px 1fr 260px}.right{padding:10px}}@media(max-width:800px){.layout{grid-template-columns:180px 1fr}.right{display:none}}
.bar{width:max-content;max-width:calc(100% - 24px)}.bar button{white-space:nowrap;flex-shrink:0}.bar input{min-width:60px}
.overlay{max-width:calc(100% - 36px);overflow-wrap:anywhere}.overlay b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.overlay p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
</head><body>
<header><h1>URDF 资产库 · 参考关节预览</h1><p>按来源查找 / 已分件几何与原始参考轴 / 包含自有资产与冻结评估状态</p></header>
<div class="layout"><aside>
<div class="stat"><div><b id="assetsN">—</b><span class="muted">装配资产</span></div><div><b id="jointsN">—</b><span class="muted">参考关节对</span></div></div>
<input id="search" placeholder="搜索名称、类别、部件…"><select id="category"><option value="">全部类别</option></select>
<select id="dataset"><option value="">全部数据来源</option></select><select id="purpose"><option value="">全部用途</option><option value="continuous_supervision">仅 continuous 正样本</option><option value="bounded_rotation_axis_auxiliary">仅有限旋转轴辅助数据</option></select><select id="filter"><option value="">全部检查状态</option><option value="unseen">尚未检查</option><option value="good">可用</option><option value="bad">有问题</option><option value="unsure">待确认</option></select>
<p id="assetCount" class="muted"></p><div id="assetList"></div>
</aside><main>
<canvas id="canvas"></canvas><div class="overlay"><b id="title">正在加载样本目录</b><p id="subtitle"></p></div>
<div id="loading">加载三维网格…</div>
<div class="legend"><span class="dot" style="background:#44b9e9"></span>运动子件　<span class="dot" style="background:#c9cfd5"></span>父件　<span class="dot" style="background:#ffce55"></span>参考轴</div>
<div class="bar"><button id="previous">←</button><button id="play">暂停</button><button id="next">→</button><input id="speed" type="range" min="0" max="2" step="0.05" value="0.35" title="转速"><button id="reset">复位视角</button></div>
</main><aside class="right">
<div class="notice">这里展示的是数据集原有标注，非模型预测。已做格式与坐标检查，未逐例验证机械合理性。播放为单关节检查，不代表整机联动仿真。</div>
<span class="label">选择参考关节</span><select id="joint"></select>
<label class="check"><input type="checkbox" id="pairOnly">仅显示父子部件</label>
<label class="check"><input type="checkbox" id="colors">显示原始颜色</label>
<label class="check"><input type="checkbox" id="axis" checked>显示参考轴和原点</label>
<div id="jointInfo"></div>
<div class="panel"><b>人工检查</b><p class="muted">记录针对当前关节；仅保存在本机浏览器中。</p><div class="row"><button class="small" data-rating="good">可用</button><button class="small" data-rating="bad">有问题</button><button class="small" data-rating="unsure">待确认</button></div><input id="note" placeholder="备注：偏轴 / 拆件不合理 / 外观…"><p id="reviewStatus" class="muted"></p><button class="small" id="export">导出检查记录 JSON</button></div>
<div class="panel"><b>原始数据</b><p id="downloads" class="muted"></p><p id="source" class="muted"></p><p id="qc" class="muted"></p></div>
</aside></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({canvas:$('canvas'),antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.001,1000);camera.up.set(0,0,1);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xdceeff,0x6b747e,2.4));for(const [x,y,z] of [[2,-3,4],[-2,1,2]]){const l=new THREE.DirectionalLight(0xffffff,2);l.position.set(x,y,z);scene.add(l);}
const loader=new GLTFLoader();let model=null,axisGroup=new THREE.Group();scene.add(axisGroup);
let manifest,filtered=[],active=null,detail=null,labels=null,selected=null,objects=new Map(),moving=new Set(),playing=true,angle=0,revision=0;
let reviews={};try{reviews=JSON.parse(localStorage.getItem('urdfAsset-reviews-v1')||'{}');}catch{}
const key=()=>active&&selected?`${active.id}/${selected.name}`:'';
const assetRating=id=>{const vals=Object.entries(reviews).filter(([k])=>k.startsWith(id+'/')).map(([,v])=>v.rating);return vals.includes('bad')?'bad':vals.includes('unsure')?'unsure':vals.includes('good')?'good':'unseen';};
function displayName(a){return (a.robot_name||a.id).split('/').slice(-2).join(' / ');}function list(){const s=$('search').value.toLowerCase(),category=$('category').value,rating=$('filter').value;filtered=manifest.assets.filter(a=>(!$('dataset').value||a.dataset===$('dataset').value)&&(!$('purpose').value||($('purpose').value==='continuous_supervision'?a.continuous_joint_count>0:a.bounded_joint_count>0))&&(!category||a.category===category)&&(!s||(a.id+' '+a.category+' '+a.robot_name).toLowerCase().includes(s))&&(!rating||assetRating(a.id)===rating));$('assetCount').textContent=`显示 ${filtered.length} / ${manifest.asset_count} 个资产`;$('assetList').replaceChildren();for(const a of filtered){const b=document.createElement('button');b.className='asset'+(a.id===active?.id?' selected':'');const n=document.createElement('div');n.className='name';n.textContent=displayName(a);const t=document.createElement('span');t.textContent=`${a.category} · ${a.joint_count} 个关节 · ${{good:'✓ 可用',bad:'有问题',unsure:'待确认',unseen:'未检查'}[assetRating(a.id)]}`;b.append(n,t);b.title=a.id;b.onclick=()=>loadAsset(a);$('assetList').append(b);}}
function dispose(root){root.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){for(const m of(Array.isArray(o.material)?o.material:[o.material]))m.dispose();}});}
function fit(){if(!detail)return;const bounds=detail.bounds,lo=new THREE.Vector3(...bounds[0]),hi=new THREE.Vector3(...bounds[1]),center=lo.clone().add(hi).multiplyScalar(.5),size=lo.distanceTo(hi);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(1.25,-1.8,1.0).normalize().multiplyScalar(size*1.7));camera.near=Math.max(size/10000,.00001);camera.far=size*100;camera.updateProjectionMatrix();controls.update();}
async function loadAsset(a){const token=++revision;active=a;list();$('loading').style.display='block';$('title').textContent=displayName(a);$('title').title=a.robot_name||a.id;$('subtitle').textContent=a.id+' · '+a.evaluation_status+' · 评估可用持续轴 '+a.eligible_continuous_joints;const base=`./${a.path}/`;try{const [d,j,gltf]=await Promise.all([fetch(base+'asset.json').then(r=>r.json()),fetch(base+'joints.json').then(r=>r.json()),loader.loadAsync(base+'scene.glb')]);if(token!==revision){dispose(gltf.scene);return;}if(model){scene.remove(model);dispose(model);}model=gltf.scene;scene.add(model);detail=d;camera.up.set(...(d.source.up_axis==='Y'?[0,1,0]:[0,0,1]));labels=j.joints;objects=new Map();for(const link of d.links){const o=model.getObjectByName(link.id);if(o){o.userData.base=o.matrix.clone();o.traverse(m=>{if(m.isMesh){m.userData.original=m.material;m.material=m.material.clone();m.material.side=THREE.DoubleSide;}});objects.set(link.id,o);}}$('joint').replaceChildren();for(let i=0;i<labels.length;i++){const o=document.createElement('option');o.value=i;o.textContent=labels[i].type+' | '+labels[i].name;$('joint').append(o);}$('source').replaceChildren();const src=document.createElement('a');src.href=d.source.url;src.target='_blank';src.textContent=d.source.dataset+' · '+d.source.license;$('source').append(src);$('qc').textContent=`${d.links.length} 个可视部件 · ${d.point_pool_size.toLocaleString()} 点 / 目标部件。${a.warnings.length?'自动提示：'+a.warnings.join('；'):'自动检查未发现格式异常。'} 未做接触、碰撞或物理验证。`;chooseJoint(0);fit();$('loading').style.display='none';window.reviewReady={asset:a.id,links:objects.size,joints:labels.length};}catch(e){$('loading').textContent='加载失败：'+e.message;console.error(e);}}
function chooseJoint(index){selected=labels[index];angle=0;moving=new Set([selected.child]);let changed=true;while(changed){changed=false;for(const j of detail.joints)if(moving.has(j.parent)&&!moving.has(j.child)){moving.add(j.child);changed=true;}}for(const o of objects.values()){o.matrix.copy(o.userData.base);o.matrixAutoUpdate=false;}dispose(axisGroup);scene.remove(axisGroup);axisGroup=new THREE.Group();scene.add(axisGroup);const p=new THREE.Vector3(...selected.origin_near_child_center),axis=new THREE.Vector3(...selected.direction_world),size=active.diagonal;const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([p.clone().addScaledVector(axis,-size*.65),p.clone().addScaledVector(axis,size*.65)]),new THREE.LineBasicMaterial({color:0xffce55,depthTest:false}));line.renderOrder=10;axisGroup.add(line);const ball=new THREE.Mesh(new THREE.SphereGeometry(size*.008,16,12),new THREE.MeshBasicMaterial({color:0xff725c,depthTest:false}));ball.position.set(...selected.origin_world);ball.renderOrder=11;axisGroup.add(ball);axisGroup.visible=$('axis').checked;style();const fmt=v=>v.map(x=>x.toFixed(5)).join(', ');$('jointInfo').textContent=`类型: ${selected.type}\n用途: ${selected.type==='continuous'?'持续旋转监督':'有限旋转轴辅助'}\n父件: ${selected.parent_name}\n子件: ${selected.child_name}\n\n原点 (m):\n[${fmt(selected.origin_world)}]\n方向 (单位向量):\n[${fmt(selected.direction_world)}]\n\n${selected.mimic?'从动关节 mimic: '+JSON.stringify(selected.mimic):'独立关节'}\n同一条轴上的原点等价。`;const base=`./${active.path}/`;$('downloads').replaceChildren();for(const [name,file] of [['GLB 装配','scene.glb'],['轴标注','joints.json'],['资产索引/原始URDF入口','registry.json'],['原始描述摘录包','source.tar.gz'],['父件点云',detail.links.find(l=>l.id===selected.parent)?.point_file],['子件点云',detail.links.find(l=>l.id===selected.child)?.point_file]]){if(!file)continue;const a=document.createElement('a');a.href=base+file;a.textContent=name;a.download='';$('downloads').append(a,document.createElement('br'));}showReview();}
function style(){if(!selected)return;for(const [id,o] of objects){o.visible=!$('pairOnly').checked||id===selected.parent||id===selected.child;o.traverse(m=>{if(!m.isMesh)return;const original=m.userData.original;const mat=m.material;mat.color.copy(original.color||new THREE.Color(0xaaaaaa));mat.opacity=1;mat.transparent=false;if(!$('colors').checked){mat.color.set(id===selected.parent?0xc9cfd5:moving.has(id)?0x44b9e9:0x607080);if(id!==selected.parent&&!moving.has(id)){mat.opacity=.23;mat.transparent=true;}}const useVertexColors=$('colors').checked?original.vertexColors:false;if(mat.vertexColors!==useVertexColors){mat.vertexColors=useVertexColors;mat.needsUpdate=true;}mat.depthWrite=mat.opacity===1;});}}
function showReview(){const r=reviews[key()];$('note').value=r?.note||'';$('reviewStatus').textContent=r?`已记录：${{good:'可用',bad:'有问题',unsure:'待确认'}[r.rating]}`:'当前关节尚未检查';document.querySelectorAll('[data-rating]').forEach(b=>b.classList.toggle('active',b.dataset.rating===r?.rating));}
function saveReview(rating){if(!key())return;reviews[key()]={asset_id:active.id,joint:selected.name,rating,note:$('note').value,updated_at:new Date().toISOString()};localStorage.setItem('urdfAsset-reviews-v1',JSON.stringify(reviews));showReview();list();}
document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>saveReview(b.dataset.rating));$('note').onchange=()=>saveReview(reviews[key()]?.rating||'unsure');$('export').onclick=()=>{const blob=new Blob([JSON.stringify(Object.values(reviews),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='continuous-axis-human-review.json';a.click();URL.revokeObjectURL(a.href);};
for(const id of ['search','category','filter','dataset','purpose'])$(id).oninput=list;for(const id of ['pairOnly','colors'])$(id).onchange=style;$('axis').onchange=()=>axisGroup.visible=$('axis').checked;$('joint').onchange=()=>chooseJoint(Number($('joint').value));$('reset').onclick=fit;$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';};function step(delta){const i=filtered.findIndex(a=>a.id===active?.id);if(filtered.length)loadAsset(filtered[(i+delta+filtered.length)%filtered.length]);}$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);document.onkeydown=e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);if(e.code==='Space'){e.preventDefault();$('play').click();}};
const clock=new THREE.Clock(),translation=new THREE.Matrix4(),rotation=new THREE.Matrix4(),inverse=new THREE.Matrix4(),delta=new THREE.Matrix4();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.1),c=$('canvas'),w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.floor(w*renderer.getPixelRatio())||c.height!==Math.floor(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}if(selected){if(playing)angle+=dt*Number($('speed').value)*Math.PI;const p=new THREE.Vector3(...selected.origin_world),d=new THREE.Vector3(...selected.direction_world);delta.copy(translation.makeTranslation(p.x,p.y,p.z)).multiply(rotation.makeRotationAxis(d,selected.type==='continuous'?angle:(Number((selected.limits_radians||selected.source_limits)?.[0])+(Number((selected.limits_radians||selected.source_limits)?.[1])-Number((selected.limits_radians||selected.source_limits)?.[0]))*(.5-.5*Math.cos(angle))-(selected.reference_q||0)))).multiply(inverse.makeTranslation(-p.x,-p.y,-p.z));for(const id of moving){const o=objects.get(id);if(o){o.matrix.copy(delta).multiply(o.userData.base);o.matrixWorldNeedsUpdate=true;}}}controls.update();renderer.render(scene,camera);}animate();
try{manifest=await fetch('./manifest.json').then(r=>r.json());$('assetsN').textContent=manifest.asset_count;$('jointsN').textContent=manifest.joint_count;for(const name of Object.keys(manifest.sources)){const o=document.createElement('option');o.value=name;o.textContent=name;$('dataset').append(o);}const categories=[...new Set(manifest.assets.map(a=>a.category))].sort();for(const name of categories){const o=document.createElement('option');o.value=name;o.textContent=name;$('category').append(o);}list();if(filtered.length)loadAsset(filtered[0]);}catch(e){$('loading').textContent='目录加载失败，请通过启动预览脚本打开：'+e.message;}
</script></body></html>
